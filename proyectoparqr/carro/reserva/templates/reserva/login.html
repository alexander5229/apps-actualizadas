{% extends 'reserva/base.html' %}

{% block title %} Iniciar Sesión - Proyectoparqr {% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">🅿️ Iniciar Sesión</h4>
                <small class="text-light">Proyectoparqr</small>
            </div>
            <div class="card-body p-4">

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuario o contraseña incorrectos. Inténtalo de nuevo.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
