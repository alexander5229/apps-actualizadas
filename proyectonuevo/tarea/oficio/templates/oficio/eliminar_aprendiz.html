
{% extends 'oficio/base.html' %}

{% block title %}Eliminar aprendiz{% endblock %}

{% block content %}
<div class="caja-confirmacion">
    <h1>Eliminar aprendiz</h1>
    <p>¿Seguro que deseas eliminar a <strong>{{ aprendiz.nombre }} {{ aprendiz.apellido }}</strong> ({{ aprendiz.tipo_documento }}: {{ aprendiz.documento }})?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-rojo">Sí, eliminar</button>
        <a href="{% url 'lista_aprendices' %}" class="btn btn-verde">Cancelar</a>
    </form>
</div>
{% endblock %}
