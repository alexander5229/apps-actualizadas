{% extends 'oficio/base.html' %}

{% block title %}{{ titulo|default:"Registrar aprendiz" }}{% endblock %}

{% block content %}
<div class="caja-formulario">
    <h1>{{ titulo|default:"Registrar nuevo aprendiz" }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit" class="btn btn-verde">Guardar aprendiz</button>
        <a href="{% url 'lista_aprendices' %}" class="btn btn-rojo">Cancelar</a>
    </form>
</div>
{% endblock %}
